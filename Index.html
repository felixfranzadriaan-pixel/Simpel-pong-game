<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pong Deluxe AI Edition</title>

<style>
body{
    margin:0;
    overflow:hidden;
    background:#050510;
    font-family:Arial,sans-serif;
    color:white;
}

canvas{
    display:block;
}

#menu{
    position:absolute;
    top:10px;
    width:100%;
    text-align:center;
    z-index:10;
}

button{
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.easy{background:#22c55e;}
.medium{background:#eab308;}
.hard{background:#ef4444;}
.impossible{background:#7c3aed;}

#score{
    position:absolute;
    top:70px;
    width:100%;
    text-align:center;
    font-size:50px;
    font-weight:bold;
}

#winner{
    position:absolute;
    top:140px;
    width:100%;
    text-align:center;
    font-size:35px;
    color:cyan;
}
</style>
</head>
<body>

<div id="menu">
    <button class="easy" onclick="setDifficulty(0.05)">Easy</button>
    <button class="medium" onclick="setDifficulty(0.09)">Medium</button>
    <button class="hard" onclick="setDifficulty(0.15)">Hard</button>
    <button class="impossible" onclick="setDifficulty(0.30)">Impossible</button>
</div>

<div id="score">0 : 0</div>
<div id="winner"></div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let playerScore = 0;
let aiScore = 0;

let aiSpeed = 0.09;

function setDifficulty(speed){
    aiSpeed = speed;
}

const player = {
    x: 30,
    y: canvas.height/2 - 60,
    w: 15,
    h: 120,
    speed: 9
};

const ai = {
    x: canvas.width - 45,
    y: canvas.height/2 - 60,
    w: 15,
    h: 120
};

const ball = {
    x: canvas.width/2,
    y: canvas.height/2,
    r: 12,
    dx: 7,
    dy: 4
};

let up = false;
let down = false;

document.addEventListener("keydown", e=>{
    if(e.key === "ArrowUp") up = true;
    if(e.key === "ArrowDown") down = true;
});

document.addEventListener("keyup", e=>{
    if(e.key === "ArrowUp") up = false;
    if(e.key === "ArrowDown") down = false;
});

function resetBall(){

    ball.x = canvas.width/2;
    ball.y = canvas.height/2;

    ball.dx =
    (Math.random() > 0.5 ? 1 : -1)
    * (6 + Math.random()*2);

    ball.dy =
    (Math.random()*6)-3;
}

function update(){

    if(up){
        player.y -= player.speed;
    }

    if(down){
        player.y += player.speed;
    }

    player.y = Math.max(
        0,
        Math.min(
            canvas.height-player.h,
            player.y
        )
    );

    let target =
        ball.y - ai.h/2;

    ai.y +=
        (target - ai.y)
        * aiSpeed;

    ball.x += ball.dx;
    ball.y += ball.dy;

    if(
        ball.y-ball.r < 0 ||
        ball.y+ball.r > canvas.height
    ){
        ball.dy *= -1;
    }

    if(
        ball.x-ball.r <
        player.x+player.w &&
        ball.y >
        player.y &&
        ball.y <
        player.y+player.h
    ){

        ball.dx =
        Math.abs(ball.dx) * 1.05;

        let hit =
        (ball.y -
        (player.y+player.h/2))
        /(player.h/2);

        ball.dy = hit * 9;
    }

    if(
        ball.x+ball.r >
        ai.x &&
        ball.y >
        ai.y &&
        ball.y <
        ai.y+ai.h
    ){

        ball.dx =
        -Math.abs(ball.dx) * 1.05;

        let hit =
        (ball.y -
        (ai.y+ai.h/2))
        /(ai.h/2);

        ball.dy = hit * 9;
    }

    if(ball.x < 0){

        aiScore++;

        document.getElementById("score")
        .textContent =
        playerScore + " : " + aiScore;

        resetBall();
    }

    if(ball.x > canvas.width){

        playerScore++;

        document.getElementById("score")
        .textContent =
        playerScore + " : " + aiScore;

        resetBall();
    }

    if(playerScore >= 3){

        document.getElementById("winner")
        .textContent =
        "🏆 YOU WIN!";

    }

    if(aiScore >= 3){

        document.getElementById("winner")
        .textContent =
        "😢YOU LOST!";

    }
}

function draw(){

    ctx.fillStyle =
    "rgba(5,5,16,0.25)";
    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    for(
        let y=0;
        y<canvas.height;
        y+=40
    ){

        ctx.fillStyle =
        "rgba(255,255,255,0.3)";

        ctx.fillRect(
            canvas.width/2-2,
            y,
            4,
            20
        );
    }

    ctx.shadowBlur = 20;
    ctx.shadowColor = "#00ffff";

    ctx.fillStyle = "#00ffff";

    ctx.fillRect(
        player.x,
        player.y,
        player.w,
        player.h
    );

    ctx.fillRect(
        ai.x,
        ai.y,
        ai.w,
        ai.h
    );

    ctx.beginPath();

    ctx.arc(
        ball.x,
        ball.y,
        ball.r,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur = 0;
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>
